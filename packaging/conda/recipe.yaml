schema_version: 1

context:
  # Bump when CMakeLists.txt libfranka_VERSION changes on the fork of main.
  version: "0.21.2"

package:
  name: libfranka
  version: ${{ version }}

source:
  path: ../..

build:
  number: 0
  # Distinguish Pixi/robostack ABI builds from official Ubuntu noble debs.
  string: pixi0_h${{ hash }}
  script: build.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - pkg-config
  host:
    # Pin matches robostack-jazzy / physical_ai_runtime Pixi lock
    # (fmt >=12.1.0,<12.2.0a0). Official noble .deb uses fmt v9 and is incompatible.
    - fmt >=12.1.0,<12.2.0a0
    - poco
    - eigen
    - pinocchio >=4.0.0,<4.2.0a0
    - tinyxml2
    - console_bridge
  run:
    - fmt >=12.1.0,<12.2.0a0
    - poco
    - eigen
    - pinocchio >=4.0.0,<4.2.0a0
    - tinyxml2
    - console_bridge

tests:
  - package_contents:
      files:
        exists:
          - lib/libfranka.so
          - lib/cmake/Franka/FrankaConfig.cmake
          - lib/cmake/Franka/FrankaTargets.cmake
          - include/franka/robot.h
        not_exists:
          - "**/*.cpp"
          - share/doc/**
  - script: |
      set -euo pipefail
      lib="$(find "$PREFIX/lib" -maxdepth 1 -name 'libfranka.so.*' -type f | head -n 1)"
      test -n "$lib"
      test -f "$PREFIX/lib/cmake/Franka/FrankaConfig.cmake"
      needed="$(readelf -d "$lib" | awk '/NEEDED/ {print $5}' | tr -d '[]')"
      echo "$needed" | grep -qx 'libfmt.so.12'
      ! echo "$needed" | grep -Eq 'libfmt\.so\.9($|\.)'
      ! echo "$needed" | grep -Eq 'libPoco(Foundation|Net)\.so\.80($|\.)'
      export LD_LIBRARY_PATH="$PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      python - <<'PY'
      import ctypes, glob, os
      libs = glob.glob(os.path.join(os.environ["PREFIX"], "lib", "libfranka.so.*"))
      libs = [p for p in libs if not os.path.islink(p)]
      assert libs, "libfranka.so.* missing"
      ctypes.CDLL(libs[0])
      print("dlopen ok:", libs[0])
      PY

about:
  homepage: https://github.com/Gabriel-Ning/libfranka
  repository: https://github.com/Gabriel-Ning/libfranka
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  summary: libfranka built against Pixi/robostack fmt 12 and conda-forge Poco
  description: |
    Fork packaging of Franka Robotics libfranka for the gabriel-robotics
    Prefix.dev channel. Linked against the same fmt 12.1.x / conda-forge Poco /
    pinocchio ABI used by physical_ai_runtime's Pixi environment. Not ABI
    compatible with official Ubuntu noble libfranka_*.deb packages (fmt v9,
    Poco SONAME .80).

extra:
  maintainers:
    - Gabriel-Ning
